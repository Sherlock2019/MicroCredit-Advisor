# Portal: static files + reverse proxy to the API gateway (same origin, so no CORS in the browser).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;  # OpenStreetMap tiles require a Referer

    location /api/ {
        proxy_pass http://api-gateway:8400;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://api-gateway:8400/health;
    }
    location = /portal-health {
        return 200 "ok\n";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
