name: ifad-rural-ai

# Local demonstration stack. Only the portal and the gateway publish ports, both on 127.0.0.1.
# The business services and PostgreSQL are reachable on the internal network only (Postgres also on 127.0.0.1 for tooling).

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  image: ifad-rural-ai/platform:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - object-store:/data/object-store
  depends_on:
    migrate:
      condition: service_completed_successfully

x-common-env: &common-env
  DEPLOYMENT_ENV: local
  DEPLOYMENT_TARGET: local-docker
  BUILD_VERSION: ${BUILD_VERSION:-0.1.0-local}
  COMMIT_SHA: ${COMMIT_SHA:-uncommitted}
  AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
  AUTH_DEV_JWT_SECRET: ${AUTH_DEV_JWT_SECRET:?set AUTH_DEV_JWT_SECRET in .env}
  AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-api://ifad-rural-ai-platform}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-all-minilm}
  STORAGE_BACKEND: local
  STORAGE_LOCAL_ROOT: /data/object-store
  FINANCE_SERVICE_URL: http://rural-finance:8401
  PROJECTS_SERVICE_URL: http://project-impact:8402
  CORS_ORIGINS: http://localhost:${PORTAL_PORT:-8480},http://127.0.0.1:${PORTAL_PORT:-8480}

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifad_platform
      POSTGRES_USER: ifad_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      SVC_GATEWAY_DB_PASSWORD: ${SVC_GATEWAY_DB_PASSWORD:?}
      SVC_FINANCE_DB_PASSWORD: ${SVC_FINANCE_DB_PASSWORD:?}
      SVC_PROJECTS_DB_PASSWORD: ${SVC_PROJECTS_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifad_owner -d ifad_platform"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    image: ifad-rural-ai/platform:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic -c database/alembic.ini upgrade head && python scripts/seed_demo.py --if-empty"]
    environment:
      <<: *common-env
      SERVICE_NAME: migrate
      DATABASE_URL: postgresql+psycopg://ifad_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/ifad_platform
    volumes:
      - object-store:/data/object-store
    depends_on:
      postgres:
        condition: service_healthy

  rural-finance:
    <<: *python-service
    command: ["uvicorn", "rural_finance.main:app", "--host", "0.0.0.0", "--port", "8401", "--no-access-log"]
    environment:
      <<: *common-env
      SERVICE_NAME: rural-finance
      DATABASE_URL: postgresql+psycopg://svc_finance:${SVC_FINANCE_DB_PASSWORD}@postgres:5432/ifad_platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8401/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  project-impact:
    <<: *python-service
    command: ["uvicorn", "project_impact.main:app", "--host", "0.0.0.0", "--port", "8402", "--no-access-log"]
    environment:
      <<: *common-env
      SERVICE_NAME: project-impact
      DATABASE_URL: postgresql+psycopg://svc_projects:${SVC_PROJECTS_DB_PASSWORD}@postgres:5432/ifad_platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8402/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    <<: *python-service
    command: ["uvicorn", "api_gateway.main:app", "--host", "0.0.0.0", "--port", "8400", "--no-access-log"]
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      DATABASE_URL: postgresql+psycopg://svc_gateway:${SVC_GATEWAY_DB_PASSWORD}@postgres:5432/ifad_platform
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8400}:8400"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8400/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      rural-finance:
        condition: service_healthy
      project-impact:
        condition: service_healthy

  portal:
    build:
      context: apps/portal
    image: ifad-rural-ai/portal:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-8480}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
  object-store:
